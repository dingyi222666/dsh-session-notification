nodeLinker: node-modules
npmRegistryServer: "https://registry.npmjs.org"
npmScopes:
  deepseek-ai:
    npmRegistryServer: "https://registry.npmjs.org"
    # Our own just-published rc packages must install immediately.
    npmMinimalAgeGate: 0
# Yarn 4's freshness gate (default 1440 min) quarantines just-published rc
# packages; these are our own @deepseek-ai/dsh-* versions, so install them
# immediately instead of waiting out the age window.
npmMinimalAgeGate: 0
